# .pre-commit-config.yaml — generated by repo-configurator wizard
# Mirrors the checks in: .github/workflows/docs_triage.yml
#
# Setup (one-time, per developer):
#   pip install pre-commit
#   pre-commit install
#
# Run manually against all files:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        types: [markdown]
      - id: end-of-file-fixer
        types: [markdown]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        types: [markdown]
  - repo: https://github.com/streetsidesoftware/cspell
    rev: "8.13.1"
    hooks:
      - id: cspell
        files: '\.md$'
        args: ["--config", ".cspellrc.json", "--no-progress"]
  - repo: https://github.com/nicolo-ribaudo/vale-pre-commit
    rev: "3.7.1"
    hooks:
      - id: vale
        files: '\.md$'
