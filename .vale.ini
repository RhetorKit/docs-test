# Vale prose style configuration — generated by repo-configurator wizard
# Invoked by: .github/workflows/docs_triage.yml
# Paths checked: docs/**/*.md *.md
#
# First-time setup:
#   1. Install Vale: https://vale.sh/docs/vale-cli/installation/
#   2. Run `vale sync` to download the Google style pack
#   3. Commit the downloaded styles to .github/styles/
#
# To promote a rule to error severity (fails CI):
#   [*.md]
#   Google.SomeName = error

StylesPath = .github/styles
MinAlertLevel = suggestion
Packages = Google

[*.md]
BasedOnStyles = Google
