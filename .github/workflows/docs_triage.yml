# .github/workflows/docs_triage.yml — generated by repo-configurator wizard
name: "Docs-as-Code Triage Automation"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'docs/**'
      - '**/*.md'

jobs:
  triage_and_route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect content-area paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'docs/api/**'
              - 'openapi.yaml'
              - 'openapi.yml'
            guides:
              - 'docs/guides/**'
            concepts:
              - 'docs/concepts/**'

      - name: Apply type and state labels
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['docs-only', 'needs-review']
            });

      - name: Apply content-area and SLA labels
        uses: actions/github-script@v7
        env:
          API_CHANGED: ${{ steps.changes.outputs.api }}
          
          
          GUIDES_CHANGED: ${{ steps.changes.outputs.guides }}
          CONCEPTS_CHANGED: ${{ steps.changes.outputs.concepts }}
        with:
          script: |
            const labelsToAdd = [];
            let isHighRisk = false;
            if (process.env.API_CHANGED === 'true') {
              labelsToAdd.push('docs/api', 'api-change', 'high-risk');
              isHighRisk = true;
            }
            if (process.env.GUIDES_CHANGED === 'true') labelsToAdd.push('docs/guides');
            if (process.env.CONCEPTS_CHANGED === 'true') labelsToAdd.push('docs/concepts');
            labelsToAdd.push(isHighRisk ? 'high-risk' : 'standard');
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [...new Set(labelsToAdd)]
            });

      - name: Remove state labels on synchronize
        if: ${{ github.event.action == 'synchronize' }}
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToRemove = ['needs-author-action', 'ready-to-merge'];
            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              }).catch(() => {});
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-review']
            });

      - name: Post SME welcome comment
        if: ${{ github.event.action == 'opened' }}
        uses: actions/github-script@v7
        env:
          API_CHANGED: ${{ steps.changes.outputs.api }}
          
          
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const isHighRisk = 
              process.env.API_CHANGED === 'true' ||
              process.env.SECURITY_CHANGED === 'true' ||
              process.env.COMPLIANCE_CHANGED === 'true';
            
            const reviewSLA = isHighRisk ? '4 business hours' : '24 business hours';
            const riskTag = isHighRisk ? '**⚠️ High-Risk Content**' : '**Standard Content**';
            const body = `### Thanks for contributing your expertise, @${prAuthor}! 👋

This is a **docs-only** pull request (${riskTag}). Our automated checks are running to verify links and formatting.

**SLA Status:** A reviewer will provide initial feedback within **${reviewSLA}** per our SLA framework.

**Your checklist before requesting review:**
- [ ] PR template is fully completed
- [ ] All internal links verified
- [ ] Formatting renders correctly in preview

**Need help?** See CONTRIBUTING.md for the escalation path, or message \`#docs\`.

---
*This message is automated. SLA clocks can be paused with a comment: \`[PAUSE: reason - ETA date]\`*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link validation (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress 'docs/**/*.md' '*.md'
          fail: true
