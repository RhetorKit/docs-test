# .github/workflows/docs_stale_pr.yml — generated by repo-configurator wizard
name: "Docs PR Stale Change Request Handler"

on:
  schedule:
    # Runs at 09:00 UTC on every business day (Mon–Fri)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  detect_stale_author_changes:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Auto-close stale PRs — Standard Content (author silence > 14 days)
        uses: actions/stale@v9
        with:
          only-labels: 'needs-author-action,standard'
          exempt-all-labels: 'high-risk,on-hold,blocked'
          days-before-stale: 5
          days-before-close: 9
          stale-pr-label: 'stale'
          close-pr-label: 'stale'
          stale-pr-message: |
            ### Stale PR Notice ⏰

            This pull request has had no activity for **5+ business days** since the reviewer posted change requests.

            **Action Required:**
            1. Push new commits addressing the reviewer's feedback
            2. Click **Re-request review** on the reviewer's card (not a comment) to restart the SLA clock
            3. If you need more time, post: `[PAUSE: reason - ETA date]`

            If no action is taken within the next 9 business days (14 total), this PR will be automatically closed. **Your branch is preserved — you can reopen anytime.**

            Need help? See the escalation path in CONTRIBUTING.md or message #docs.
          close-pr-message: |
            ### PR Auto-Closed: 14+ Business Days of Inactivity

            This PR has been automatically closed. **Your branch is preserved.**

            To resume: reopen this PR, push commits addressing the outstanding feedback, and click **Re-request review**.

      - name: Escalate stale PRs — High-Risk Content (no auto-close)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const now = new Date();
            const STALE_DAYS = 14;

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes('needs-author-action') || !labels.includes('high-risk')) continue;
              if (labels.includes('on-hold') || labels.includes('blocked')) continue;

              const daysSinceUpdate = (now - new Date(pr.updated_at)) / (1000 * 60 * 60 * 24);
              if (daysSinceUpdate < STALE_DAYS) continue;

              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### Escalation Required: High-Risk PR Stale ⚠️

This is **high-risk** documentation (security, compliance, or API). No activity for **${Math.floor(daysSinceUpdate)}+ business days** after a "Request Changes" review — escalation required instead of auto-close.

**@ghoulmann:** Please review this PR's status, assign a new reviewer, or contact the author directly.

- PR author: @${pr.user.login}
- Last updated: ${new Date(pr.updated_at).toLocaleDateString()}
- Check PR comments for any \`[PAUSE]\` notation before taking action.`
              });

              await github.rest.issues.addLabels({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['stale', 'blocked']
              });
            }

  remind_reviewers_of_pending_feedback:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Remind reviewers — Standard Content (needs-review > 24h)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const now = new Date();
            const SLA_HOURS = 24;

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes('needs-review') || !labels.includes('standard')) continue;
              if (labels.includes('blocked') || labels.includes('on-hold')) continue;

              const hoursSinceUpdate = (now - new Date(pr.updated_at)) / (1000 * 60 * 60);
              if (hoursSinceUpdate < SLA_HOURS) continue;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const recentReminder = comments.some(c =>
                c.user.type === 'Bot' &&
                c.body.includes('Reviewer SLA Reminder') &&
                (now - new Date(c.created_at)) / (1000 * 60 * 60) < 24
              );
              if (recentReminder) continue;

              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### Reviewer SLA Reminder

This PR has been waiting for review for **${Math.floor(hoursSinceUpdate)} hours** (SLA: ${SLA_HOURS}h for standard content).

Assigned reviewers: please complete your review or reassign per the escalation policy in CONTRIBUTING.md.`
              });
            }

      - name: Escalate reviewer silence — High-Risk Content (needs-review > 4h)
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const now = new Date();
            const SLA_HOURS = 4;

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes('needs-review') || !labels.includes('high-risk')) continue;
              if (labels.includes('blocked') || labels.includes('on-hold')) continue;

              const hoursSinceUpdate = (now - new Date(pr.updated_at)) / (1000 * 60 * 60);
              if (hoursSinceUpdate < SLA_HOURS) continue;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const recentEscalation = comments.some(c =>
                c.user.type === 'Bot' &&
                c.body.includes('High-Risk Review SLA Escalation') &&
                (now - new Date(c.created_at)) / (1000 * 60 * 60) < SLA_HOURS
              );
              if (recentEscalation) continue;

              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### High-Risk Review SLA Escalation ⚠️

This **high-risk** documentation PR has been awaiting review for **${Math.floor(hoursSinceUpdate)} hours** (SLA: ${SLA_HOURS}h).

@ghoulmann: please review or reassign urgently.`
              });

              await github.rest.issues.addLabels({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['blocked']
              });
            }
