# .github/labels.yml — generated by repo-configurator wizard
# Apply with: gh label import .github/labels.yml --repo RhetorKit/docs-test
# Requires GitHub CLI v2.8+

labels:
  # ── Type Labels ──────────────────────────────────────────────────────────────

  - name: "docs-only"
    color: "0075ca"
    description: "PR contains only documentation changes. Eligible for fast-track review SLA."

  - name: "api-change"
    color: "e4e669"
    description: "PR modifies public API documentation or OpenAPI specs. Requires CODEOWNER approval."

  - name: "internal-sme"
    color: "cfd3d7"
    description: "Contributed by a subject matter expert. May need extra workflow guidance."

  # ── SLA / Urgency Labels ─────────────────────────────────────────────────────

  - name: "high-risk"
    color: "d93f0b"
    description: "High-risk content area (api). 4h reviewer SLA enforced."

  - name: "standard"
    color: "0e8a16"
    description: "Standard content area (guides, concepts, how-tos). 24h reviewer SLA enforced."

  # ── Workflow State Labels ─────────────────────────────────────────────────────

  - name: "needs-review"
    color: "7c3aed"
    description: "PR is awaiting reviewer attention. Reviewer SLA clock is running."

  - name: "needs-author-action"
    color: "e11d48"
    description: "Reviewer requested changes. Author has 48h (standard) or 24h (high-risk) to respond."

  - name: "ready-to-merge"
    color: "16a34a"
    description: "All checks pass and approvals received. Eligible for merge or auto-merge."

  - name: "stale"
    color: "6b7280"
    description: "No activity past SLA window. Subject to auto-close (standard) or escalation (high-risk)."

  - name: "blocked"
    color: "b91c1c"
    description: "Blocked on external dependency or unresolved question. Requires manual resolution."

  - name: "on-hold"
    color: "92400e"
    description: "Docs lead has placed this PR on hold. Do not review, merge, or auto-close."

  # ── Content Area Labels ───────────────────────────────────────────────────────

  - name: "docs/guides"
    color: "bfdbfe"
    description: "Affects docs/guides/ — how-to content, tutorials, getting-started guides."

  - name: "docs/concepts"
    color: "bbf7d0"
    description: "Affects docs/concepts/ — conceptual docs, architecture explanations, design decisions."
